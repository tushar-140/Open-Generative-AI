# fly launch --copy-config --no-deploy && fly volumes create newspulse_data --size 1 && fly deploy
app = "newspulse"
primary_region = "bom"

[build]

[env]
  PORT = "8080"
  DATA_DIR = "/data"

[mounts]
  source = "newspulse_data"
  destination = "/data"

[http_service]
  internal_port = 8080
  force_https = true
  # The poller must keep running for notifications: never scale to zero.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[http_service.checks]]
  grace_period = "10s"
  interval = "30s"
  method = "GET"
  path = "/api/health"
  timeout = "5s"
