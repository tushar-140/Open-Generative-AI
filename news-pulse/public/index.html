<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>NewsPulse</title>
  <meta name="description" content="{{OG_DESC}}">
  <meta property="og:title" content="{{OG_TITLE}}">
  <meta property="og:description" content="{{OG_DESC}}">
  <meta property="og:type" content="website">
  <meta property="og:image" content="{{BASE}}/icons/icon-512.png">
  <meta name="twitter:card" content="summary">
  <meta name="theme-color" content="#0f172a">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/icon-192.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <link rel="stylesheet" href="/styles.css">
  <script type="module" src="/app.js"></script>
</head>
<body>
  <header class="top">
    <div class="brand">
      <img src="/icons/icon.svg" alt="" width="28" height="28">
      <span class="name">NewsPulse</span>
      <span id="live" class="live" data-mode="connecting"><i></i><b data-i18n="connecting">connecting</b></span>
    </div>
    <div class="actions">
      <button id="uiLangBtn" class="ghost" aria-label="Interface language">हिंदी</button>
      <button id="installBtn" class="ghost" hidden data-i18n="install">Install</button>
      <button id="shareBtn" class="ghost" data-i18n="share">Share</button>
      <button id="notifyBtn" class="primary" data-i18n="alerts">🔔 Alerts</button>
    </div>
  </header>

  <!-- Step 1: choose what to follow -->
  <section id="finder" class="finder">
    <button id="finderSummary" class="summary" aria-expanded="false" aria-controls="finderBody">
      <span id="summaryText"></span>
      <span class="change" data-i18n="change">Change</span>
    </button>
    <form id="finderBody" class="finder-body" autocomplete="off">
      <div class="field">
        <span class="step">1</span>
        <label for="placeInput" data-i18n="where">Where?</label>
        <div class="where">
          <select id="countrySelect" aria-label="Country"></select>
          <input id="placeInput" list="placeList" maxlength="60">
          <datalist id="placeList"></datalist>
        </div>
        <small class="hint" data-i18n="placeHint">State, district or city — optional.</small>
      </div>
      <div class="field">
        <span class="step">2</span>
        <span class="label" data-i18n="topic">Topic</span>
        <div id="topicChips" class="chips" role="radiogroup"></div>
        <input id="keywordsInput" maxlength="200" hidden>
      </div>
      <div class="field" id="langField">
        <span class="step">3</span>
        <span class="label" data-i18n="newsLang">News language</span>
        <div id="langChips" class="segmented" role="radiogroup"></div>
      </div>
      <p id="finderError" class="error" hidden></p>
      <button id="showBtn" class="primary wide" type="submit" data-i18n="showNews">Show news</button>
    </form>
  </section>

  <!-- Quick switch between feeds -->
  <section class="shortcuts">
    <div id="myFeeds" class="chips scroll" aria-label="Your feeds"></div>
  </section>

  <section class="feedhead">
    <h1 id="feedTitle"></h1>
    <p id="feedStatus" class="hint"></p>
  </section>

  <nav class="tabs" role="tablist">
    <button role="tab" data-status="verified" class="tab"><span data-i18n="tabVerified">✅ Verified</span> <b data-count="verified"></b></button>
    <button role="tab" data-status="verified,developing" class="tab"><span data-i18n="tabDeveloping">🟡 + Developing</span> <b data-count="developing"></b></button>
    <button role="tab" data-status="" class="tab"><span data-i18n="tabAll">All</span> <b data-count="all"></b></button>
  </nav>

  <button id="newPill" class="pill" hidden></button>
  <main id="stories" aria-live="polite"></main>
  <div id="empty" class="empty" hidden></div>

  <footer class="foot" data-i18n="footer">
    “Verified” means independent outlets corroborate the story (sister outlets and copied wire text count once). It reduces, but does not eliminate, false reports — open the sources.
  </footer>

  <dialog id="notifyDialog">
    <form id="notifyForm" method="dialog">
      <h2 data-i18n="alertsTitle">Alerts for this feed</h2>
      <p id="notifyFeedName" class="hint"></p>
      <fieldset>
        <label class="radio"><input type="radio" name="level" value="verified" checked> <span data-i18n="levelVerified">Only verified stories</span></label>
        <label class="radio"><input type="radio" name="level" value="developing"> <span data-i18n="levelDeveloping">Developing and verified</span></label>
      </fieldset>
      <p id="notifyMsg" class="hint"></p>
      <div class="row">
        <button id="unsubBtn" type="button" class="ghost" data-i18n="turnOff">Turn off</button>
        <button id="subBtn" type="button" class="primary" data-i18n="turnOn">Turn on</button>
      </div>
      <div class="row end"><button value="close" class="ghost" data-i18n="close">Close</button></div>
    </form>
  </dialog>

  <div id="toast" class="toast" role="status" hidden></div>
</body>
</html>
